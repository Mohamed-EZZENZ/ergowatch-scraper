name: ErgoWatch — Veille Maroc + France

on:
  schedule:
    - cron: '0 6 * * *'    # 07h00 heure Maroc (UTC+1)
    - cron: '0 17 * * *'   # 18h00 heure Maroc (UTC+1)
  workflow_dispatch:        # Bouton manuel "Run workflow"

jobs:
  scrape-et-notifier:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ── 1. Récupérer le code ──────────────────────────────────────
      - name: 📥 Récupérer le code
        uses: actions/checkout@v3

      # ── 2. Installer Python ───────────────────────────────────────
      - name: 🐍 Installer Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Installer les dépendances ──────────────────────────────
      - name: 📦 Installer les dépendances
        run: pip install -r requirements.txt

      # ── 4. Lancer le scraper Maroc ────────────────────────────────
      #     Utilise désormais les MÊMES secrets que le scraper France
      #     → une seule et même base Supabase pour les deux pays
      - name: 🇲🇦 Scraper Maroc (marchespublics.gov.ma)
        id: scraper_maroc
        run: python scraper.py 2>&1 | tee maroc_output.txt
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_DESTINATAIRE: ${{ secrets.EMAIL_DESTINATAIRE }}
        continue-on-error: true

      # ── 5. Lancer le scraper France ───────────────────────────────
      - name: 🇫🇷 Scraper France (sources françaises)
        id: scraper_france
        run: python scraper_france.py 2>&1 | tee france_output.txt
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_DESTINATAIRE: ${{ secrets.EMAIL_DESTINATAIRE }}
        continue-on-error: true

      # ── 6. Préparer l'heure Maroc (pour les logs) ──────────────────
      - name: 🕐 Préparer le rapport
        id: rapport
        run: |
          HEURE=$(TZ='Africa/Casablanca' date '+%d/%m/%Y à %Hh%M')
          echo "heure=$HEURE" >> $GITHUB_OUTPUT

      # ── 7. Résumé lisible dans les logs GitHub ─────────────────────
      #     (remplace l'ancien email générique — les emails "nouveautés"
      #      sont désormais envoyés directement par scraper.py / scraper_france.py)
      - name: 📊 Résumé de l'exécution
        if: always()
        run: |
          echo "═══════════════════════════════════════"
          echo "🎯 ErgoWatch — Rapport du ${{ steps.rapport.outputs.heure }}"
          echo "═══════════════════════════════════════"
          echo "🇲🇦 Scraper Maroc  : ${{ steps.scraper_maroc.outcome }}"
          echo "🇫🇷 Scraper France : ${{ steps.scraper_france.outcome }}"
          echo "═══════════════════════════════════════"

      # ── 8. Email UNIQUEMENT en cas d'échec technique des DEUX scrapers ─
      - name: ❌ Email — Erreur technique (double échec)
        if: steps.scraper_maroc.outcome == 'failure' && steps.scraper_france.outcome == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ ErgoWatch — Erreur technique du ${{ steps.rapport.outputs.heure }}"
          to: ${{ secrets.EMAIL_DESTINATAIRE }}
          from: "ErgoWatch Maroc <${{ secrets.EMAIL_USER }}>"
          body: |
            Bonjour,

            ⚠️ Les DEUX scrapers (Maroc et France) ont échoué lors de
            l'exécution du ${{ steps.rapport.outputs.heure }}.

            👉 Consultez les logs pour diagnostiquer :
            https://github.com/${{ github.repository }}/actions

            Cordialement,
            Votre robot ErgoWatch 🤖
            # test relance
